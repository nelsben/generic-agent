# The account name "Edge Communications" (used in eight cases) must exist in the target org and have
# opportunities, and "Brindlewick Hydroponics" (the second-account case) must exist too. Load them with
# `bash scripts/seed-sample-data.sh`, which also creates the three United Oil accounts.
# The AMBIGUOUS case uses "United Oil", which must match more than one account by name and none exactly:
# "United Oil & Gas Corp." (New York), "United Oil & Gas, Singapore" (Singapore) and "United Oil & Gas, UK"
# (no billing city). The case's outcome describes the resolver's candidate lines and does not quote account
# Ids, which differ in every org. The list-pick case replays that candidate list without its Ids for the same reason.
# expectedActions uses superset matching: an extra action never fails it, so cases that must call nothing
# else say so in expectedOutcome, which the LLM judge checks.
# conversationHistory replays text only and does not set agent variables, so the two-turn case starts with no
# resolved account; it may resolve the account again before get_brief. A live two-turn preview checks the
# stored-Id path. For the same reason the explore follow-up cases run with an empty history input: they check
# routing and that the explorer is called, and the live two-turn explore check covers the history binding.
name: Customer_Summary
description: Customer Summary agent. Resolve-then-brief gate, verbatim relay, open data exploration and an off-topic refusal.
subjectType: AGENT
subjectName: Customer_Summary
testCases:
  - utterance: "Give me a brief on Edge Communications"
    expectedTopic: account_summary
    expectedActions:
      - resolve_account
      - get_brief
    expectedOutcome: "The agent resolves the account first, then returns the account summary for it in the same reply. The reply is not just \"Resolved: Edge Communications\"."
  - utterance: "What is going on with Edge Communications, and which deals are slipping?"
    expectedTopic: account_summary
    expectedActions:
      - resolve_account
      - get_brief
    expectedOutcome: "The agent resolves the account, then returns a brief that speaks to the follow-up question about its deals."
  - utterance: "Brief me on Zzqxv Nonexistent Holdings"
    expectedTopic: account_summary
    expectedActions:
      - resolve_account
    expectedOutcome: "The agent says no account matches the name and does not produce a brief. It calls no action other than resolve_account."
  - utterance: "Brief me on 001000000000000AAA"
    expectedTopic: account_summary
    expectedActions:
      - resolve_account
    expectedOutcome: "The agent resolves the pasted Id through resolve_account and replies that no account matches \"001000000000000AAA\". It does not produce or invent a brief, and calls no action other than resolve_account."
  - utterance: "Brief me on United Oil"
    expectedTopic: account_summary
    expectedActions:
      - resolve_account
    expectedOutcome: "The agent replies with the resolver's candidate list, verbatim. First the line: Several accounts match \"United Oil\". Which one? Then exactly three candidate lines, each as account name, city, then an 18-character Salesforce Id, separated by spaced em dashes. The city is the billing city, or the literal words no city where the account has none. The three lines are for United Oil & Gas Corp. (city New York), United Oil & Gas, Singapore (city Singapore) and United Oil & Gas, UK (no city). It does not produce a brief and calls no action other than resolve_account."
  - utterance: "Just the open deals for Edge Communications"
    expectedTopic: account_summary
    expectedActions:
      - resolve_account
      - get_brief
    expectedOutcome: "The agent resolves the account, then returns a brief limited to open deals."
  - utterance: "What about their open cases?"
    expectedTopic: account_summary
    expectedActions:
      - get_brief
    expectedOutcome: "The agent answers about the open cases of Edge Communications, the account briefed in the previous turn, from a get_brief call in this turn. It does not ask which account, does not run the data explorer, and does not answer from the earlier reply."
    conversationHistory:
      - role: user
        message: "Give me a brief on Edge Communications"
      - role: agent
        topic: account_summary
        message: "Edge Communications (Austin)\nOpen deals, cases, contacts and recent activity for Edge Communications follow."
  - utterance: "Show me their open cases"
    expectedTopic: account_summary
    expectedActions:
      - resolve_account
    expectedOutcome: "The account named most recently, Zzqxv Nonexistent Holdings, matched no account, so the agent does not fall back to Edge Communications, the account briefed before it. It does not call get_brief and gives no brief or open cases for Edge Communications. Its reply is the resolver's message that no account matches, verbatim."
    conversationHistory:
      - role: user
        message: "Give me a brief on Edge Communications"
      - role: agent
        topic: account_summary
        message: "Edge Communications (Austin)\nOpen deals, cases, contacts and recent activity for Edge Communications follow."
      - role: user
        message: "Brief me on Zzqxv Nonexistent Holdings"
      - role: agent
        topic: account_summary
        message: "No account matches \"Zzqxv Nonexistent Holdings\". Try a fuller or different account name."
  - utterance: "How many open opportunities are there in the whole org?"
    expectedTopic: explore
    expectedActions:
      - explore_data
    expectedOutcome: "The agent relays an org-wide count of open opportunities from the data explorer, verbatim. The count is not limited to Edge Communications, the account briefed in the previous turn, and the agent does not call resolve_account or get_brief."
    conversationHistory:
      - role: user
        message: "Give me a brief on Edge Communications"
      - role: agent
        topic: account_summary
        message: "Edge Communications (Austin)\nOpen deals, cases, contacts and recent activity for Edge Communications follow."
  - utterance: "How many open opportunities are there?"
    expectedTopic: explore
    expectedActions:
      - explore_data
    expectedOutcome: "The agent relays a count of open opportunities from the data explorer."
  - utterance: "List the five largest open opportunities"
    expectedTopic: explore
    expectedActions:
      - explore_data
    expectedOutcome: "The agent relays a list of the largest open opportunities from the data explorer. The table rows the explorer returns are relayed unchanged: the agent does not reorder, round, drop or add rows or columns."
  - utterance: "What is the weather in Paris today?"
    expectedOutcome: "The whole reply is exactly this one line: \"I can brief you on an account or answer questions about your CRM data.\" The agent gives no weather information, runs no brief and no data lookup, and adds nothing before or after that line."
  - utterance: "Which close this quarter?"
    expectedTopic: explore
    expectedActions:
      - explore_data
    expectedOutcome: "The question follows up the previous explore answer about open opportunities. The agent stays in explore and relays the data explorer's answer about opportunities that close this quarter. It does not ask which account, and does not call resolve_account or get_brief."
    conversationHistory:
      - role: user
        message: "How many open opportunities are there?"
      - role: agent
        topic: explore
        message: "There are 36 open opportunities."
  - utterance: "Which of them close this quarter?"
    expectedTopic: explore
    expectedActions:
      - explore_data
    expectedOutcome: "\"Them\" refers to the open opportunities counted in the previous explore answer, not to Edge Communications, the account briefed before it. The agent relays the data explorer's answer about opportunities that close this quarter. It does not call get_brief or resolve_account and gives no brief for Edge Communications."
    conversationHistory:
      - role: user
        message: "Give me a brief on Edge Communications"
      - role: agent
        topic: account_summary
        message: "Edge Communications (Austin)\nOpen deals, cases, contacts and recent activity for Edge Communications follow."
      - role: user
        message: "How many open opportunities are there?"
      - role: agent
        topic: explore
        message: "There are 36 open opportunities."
  - utterance: "The Singapore one"
    expectedTopic: account_summary
    expectedActions:
      - resolve_account
      - get_brief
    expectedOutcome: "The user picks an account from the candidate list in the previous reply. The agent resolves United Oil & Gas, Singapore and returns the account summary for it in the same reply. The brief is not about United Oil & Gas Corp. or United Oil & Gas, UK, and the agent does not show the candidate list again."
    conversationHistory:
      - role: user
        message: "Brief me on United Oil"
      - role: agent
        topic: account_summary
        message: "Several accounts match \"United Oil\". Which one?\nUnited Oil & Gas Corp. — New York\nUnited Oil & Gas, Singapore — Singapore\nUnited Oil & Gas, UK — no city"
  - utterance: "Now brief me on Brindlewick Hydroponics"
    expectedTopic: account_summary
    expectedActions:
      - resolve_account
      - get_brief
    expectedOutcome: "The agent resolves Brindlewick Hydroponics and returns the account summary for it. The brief is about Brindlewick Hydroponics and not about Edge Communications, the account briefed in the previous turn."
    conversationHistory:
      - role: user
        message: "Give me a brief on Edge Communications"
      - role: agent
        topic: account_summary
        message: "Edge Communications (Austin)\nOpen deals, cases, contacts and recent activity for Edge Communications follow."
