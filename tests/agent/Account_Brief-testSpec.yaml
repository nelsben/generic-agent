# The account name "Edge Communications" (used in six cases) must exist in the target org and have
# opportunities. It is a standard Developer Edition sample account. Change it if the org lacks it.
# The AMBIGUOUS case uses "United Oil", which must match more than one account by name and none exactly.
# A read-only query of the experimental org (2026-11-11) found three: "United Oil & Gas Corp." (New York),
# "United Oil & Gas, Singapore" (Singapore) and "United Oil & Gas, UK" (no city). These also must exist in
# the target org. The case's outcome quotes the resolver's candidate lines with their experimental-org Ids;
# change the Ids for another org.
# expectedActions uses superset matching: an extra action never fails it, so cases that must call nothing
# else say so in expectedOutcome, which the LLM judge checks.
# conversationHistory replays text only and does not set agent variables, so the two-turn case starts with no
# resolved account; it may resolve the account again before get_brief. A live two-turn preview checks the
# stored-Id path.
name: Account_Brief
description: Account Brief agent. Resolve-then-brief gate, verbatim relay, open data exploration and an off-topic refusal.
subjectType: AGENT
subjectName: Account_Brief
testCases:
  - utterance: "Give me a brief on Edge Communications"
    expectedTopic: account_brief
    expectedActions:
      - resolve_account
      - get_brief
    expectedOutcome: "The agent resolves the account first, then returns the account brief for it in the same reply. The reply is not just \"Resolved: Edge Communications\"."
  - utterance: "What is going on with Edge Communications, and which deals are slipping?"
    expectedTopic: account_brief
    expectedActions:
      - resolve_account
      - get_brief
    expectedOutcome: "The agent resolves the account, then returns a brief that speaks to the follow-up question about its deals."
  - utterance: "Brief me on Zzqxv Nonexistent Holdings"
    expectedTopic: account_brief
    expectedActions:
      - resolve_account
    expectedOutcome: "The agent says no account matches the name and does not produce a brief. It calls no action other than resolve_account."
  - utterance: "Brief me on 001000000000000AAA"
    expectedTopic: account_brief
    expectedActions:
      - resolve_account
    expectedOutcome: "The agent resolves the pasted Id through resolve_account and replies that no account matches \"001000000000000AAA\". It does not produce or invent a brief, and calls no action other than resolve_account."
  - utterance: "Brief me on United Oil"
    expectedTopic: account_brief
    expectedActions:
      - resolve_account
    expectedOutcome: "The agent replies with the resolver's candidate list, verbatim. First the line: Several accounts match \"United Oil\". Which one? Then three candidate lines, each as name — city — Id, with the literal words no city where the account has no billing city: United Oil & Gas Corp. — New York — 001gK00001Fb9BKQAZ; United Oil & Gas, Singapore — Singapore — 001gK00001Fb9BOQAZ; United Oil & Gas, UK — no city — 001gK00001Fb9BNQAZ. It does not produce a brief and calls no action other than resolve_account."
  - utterance: "Just the open deals for Edge Communications"
    expectedTopic: account_brief
    expectedActions:
      - resolve_account
      - get_brief
    expectedOutcome: "The agent resolves the account, then returns a brief limited to open deals."
  - utterance: "What about their open cases?"
    expectedTopic: account_brief
    expectedActions:
      - get_brief
    expectedOutcome: "The agent answers about the open cases of Edge Communications, the account briefed in the previous turn, from a get_brief call in this turn. It does not ask which account, does not run the data explorer, and does not answer from the earlier reply."
    conversationHistory:
      - role: user
        message: "Give me a brief on Edge Communications"
      - role: agent
        topic: account_brief
        message: "Edge Communications (Austin)\nOpen deals, cases, contacts and recent activity for Edge Communications follow."
  - utterance: "Show me their open cases"
    expectedTopic: account_brief
    expectedActions:
      - resolve_account
    expectedOutcome: "The account named most recently, Zzqxv Nonexistent Holdings, matched no account, so the agent does not fall back to Edge Communications, the account briefed before it. It does not call get_brief and gives no brief or open cases for Edge Communications. Its reply is the resolver's message that no account matches, verbatim."
    conversationHistory:
      - role: user
        message: "Give me a brief on Edge Communications"
      - role: agent
        topic: account_brief
        message: "Edge Communications (Austin)\nOpen deals, cases, contacts and recent activity for Edge Communications follow."
      - role: user
        message: "Brief me on Zzqxv Nonexistent Holdings"
      - role: agent
        topic: account_brief
        message: "No account matches \"Zzqxv Nonexistent Holdings\". Try the full name or open the account and ask again."
  - utterance: "How many open opportunities are there in the whole org?"
    expectedTopic: explore
    expectedActions:
      - explore_data
    expectedOutcome: "The agent relays an org-wide count of open opportunities from the data explorer, verbatim. The count is not limited to Edge Communications, the account briefed in the previous turn, and the agent does not call resolve_account or get_brief."
    conversationHistory:
      - role: user
        message: "Give me a brief on Edge Communications"
      - role: agent
        topic: account_brief
        message: "Edge Communications (Austin)\nOpen deals, cases, contacts and recent activity for Edge Communications follow."
  - utterance: "How many open opportunities are there?"
    expectedTopic: explore
    expectedActions:
      - explore_data
    expectedOutcome: "The agent relays a count of open opportunities from the data explorer."
  - utterance: "List the five largest open opportunities"
    expectedTopic: explore
    expectedActions:
      - explore_data
    expectedOutcome: "The agent relays a list of the largest open opportunities from the data explorer."
  - utterance: "What is the weather in Paris today?"
    expectedTopic: topic_selector
    expectedOutcome: "The whole reply is exactly this one line: \"I can brief you on an account or answer questions about your CRM data.\" The agent gives no weather information, runs no brief and no data lookup, and adds nothing before or after that line."
