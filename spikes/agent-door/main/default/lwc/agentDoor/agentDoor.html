<template>
    <lightning-card title="Agent door spike" icon-name="standard:einstein_replies">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={hasTurns}>
                <ol class="slds-list_ordered">
                    <template for:each={turns} for:item="t">
                        <li key={t.key} class="slds-var-m-bottom_small">
                            <p class="slds-text-title">You, turn {t.number}</p>
                            <p>{t.message}</p>
                            <p class="slds-text-title slds-var-m-top_x-small">Agent, {t.seconds} s</p>
                            <p class="reply">{t.reply}</p>
                        </li>
                    </template>
                </ol>
            </template>
            <template lwc:if={errorText}>
                <p class="slds-text-color_error" role="alert">{errorText}</p>
            </template>
            <template lwc:if={ended}>
                <p class="slds-text-color_weak" role="status">{endNote}</p>
            </template>
            <lightning-textarea
                label="Message"
                value={draft}
                disabled={inputDisabled}
                onchange={handleChange}
            ></lightning-textarea>
            <div class="slds-var-m-top_small">
                <lightning-button
                    label={sendLabel}
                    variant="brand"
                    disabled={sendDisabled}
                    onclick={handleSend}
                ></lightning-button>
                <lightning-button
                    class="slds-var-m-left_x-small end"
                    label="End"
                    disabled={endDisabled}
                    onclick={handleEnd}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
