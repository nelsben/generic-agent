<template>
    <div class="voice">
        <template lwc:if={isSupported}>
            <button
                type="button"
                class={buttonClass}
                aria-label={buttonLabel}
                aria-pressed={ariaPressed}
                onclick={handleToggle}
            >
                <svg class="mic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                    <path
                        fill="currentColor"
                        d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"
                    ></path>
                </svg>
            </button>
            <span lwc:if={recording} class="status" aria-hidden="true">Listening</span>
        </template>
        <p lwc:else class="unsupported">Voice input is not available in this browser. You can type instead.</p>
        <p lwc:if={errorMessage} class="error" role="alert">{errorMessage}</p>
        <span class="visually-hidden" aria-live="polite">{announcement}</span>
    </div>
</template>
